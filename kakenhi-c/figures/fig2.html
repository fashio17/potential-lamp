<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"IPAPGothic","IPAGothic",sans-serif; background:#fff; width:1500px; padding:26px 20px 18px; color:#1f2937; }
  h1 { font-size:26px; text-align:center; margin-bottom:10px; }
  .cap { text-align:center; font-size:14px; color:#6b7280; margin-top:4px; }
</style>
<body>
<h1>図2　規範内在化 → 装いの自律性 → FPS → ウェルビーイングの理論モデル</h1>
<svg width="1460" height="600" viewBox="0 0 1460 600">
  <defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#33527d"/>
    </marker>
    <marker id="ahg" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- 上段モデレータ：文化圏・ジェンダー -->
  <rect x="480" y="30" width="500" height="86" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="730" y="66" text-anchor="middle" font-size="21" font-weight="bold" fill="#374151">文化圏（7カ国比較）・ジェンダー</text>
  <text x="730" y="96" text-anchor="middle" font-size="16.5" fill="#4b5563">測定不変性（MG-CFA）を確認のうえ構造差を検証（調整要因）</text>

  <!-- モデレータ矢印（上から各パスへ） -->
  <line x1="560" y1="116" x2="392" y2="288" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
  <line x1="730" y1="116" x2="730" y2="288" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
  <line x1="900" y1="116" x2="1068" y2="288" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>

  <!-- 主要パス（中段） -->
  <!-- Box1 規範内在化 -->
  <rect x="20" y="300" width="310" height="130" rx="10" fill="#eef3fa" stroke="#33527d" stroke-width="3"/>
  <text x="175" y="345" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">「似合う」規範の内在化</text>
  <text x="175" y="378" text-anchor="middle" font-size="17" fill="#374151">自律的受容 ⇔ 統制的受容</text>
  <text x="175" y="406" text-anchor="middle" font-size="15.5" fill="#4b5563">（自己決定理論：Deci &amp; Ryan, 2000）</text>

  <line x1="330" y1="365" x2="440" y2="365" stroke="#33527d" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Box2 装いの自律性 -->
  <rect x="445" y="300" width="270" height="130" rx="10" fill="#eef3fa" stroke="#33527d" stroke-width="3"/>
  <text x="580" y="352" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e3a8a">装いの自律性</text>
  <text x="580" y="388" text-anchor="middle" font-size="16.5" fill="#374151">自己決定的な衣服選択・</text>
  <text x="580" y="412" text-anchor="middle" font-size="16.5" fill="#374151">意思決定の質（WDQI）</text>

  <line x1="715" y1="365" x2="825" y2="365" stroke="#33527d" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Box3 FPS（強調） -->
  <rect x="830" y="292" width="310" height="146" rx="10" fill="#dbe7f6" stroke="#1e3a8a" stroke-width="4"/>
  <text x="985" y="338" text-anchor="middle" font-size="23" font-weight="bold" fill="#1e3a8a">FPS</text>
  <text x="985" y="372" text-anchor="middle" font-size="19" font-weight="bold" fill="#1e3a8a">装い由来の心理的安定感</text>
  <text x="985" y="404" text-anchor="middle" font-size="15.5" fill="#374151">（似合い知覚 SP を含む中核概念）</text>

  <line x1="1140" y1="365" x2="1250" y2="365" stroke="#33527d" stroke-width="4" marker-end="url(#ah)"/>

  <!-- Box4 ウェルビーイング -->
  <rect x="1255" y="300" width="190" height="130" rx="10" fill="#eef3fa" stroke="#33527d" stroke-width="3"/>
  <text x="1350" y="350" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">ウェル</text>
  <text x="1350" y="380" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e3a8a">ビーイング</text>
  <text x="1350" y="412" text-anchor="middle" font-size="15.5" fill="#374151">自己効力感 ほか</text>

  <!-- 下段モデレータ：環境要因 -->
  <rect x="330" y="500" width="800" height="80" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="8 5"/>
  <text x="730" y="535" text-anchor="middle" font-size="20" font-weight="bold" fill="#374151">ファストファッション環境／SNS・「似合う」診断／生成AIによる助言</text>
  <text x="730" y="564" text-anchor="middle" font-size="16.5" fill="#4b5563">装い情報の供給源：受容のしかたにより支援にも阻害にもなる（調整・介入要因）</text>

  <!-- 下段モデレータ矢印 -->
  <line x1="560" y1="500" x2="392" y2="438" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
  <line x1="730" y1="500" x2="730" y2="438" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#ahg)"/>
</svg>
<div class="cap">実線＝主要パス（R10：4カ国オンライン調査＋R8：日台韓データで検証）　破線＝調整要因（R11：教育介入・AI実験で介入的に検証）</div>
</body>
